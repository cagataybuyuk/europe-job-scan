[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "europe-job-scan-service"
version = "0.12.0a1"
description = "Europe Job Scan Google-native Apps Script control plane and Cloud Run browser execution bootstrap"
requires-python = ">=3.11"
dependencies = ["playwright>=1.46"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
