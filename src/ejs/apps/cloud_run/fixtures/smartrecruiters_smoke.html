<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EJS SmartRecruiters Smoke</title></head>
<body>
  <main>
    <h1>Business Analyst</h1>
    <form>
      <label for="firstName">First name *</label><input id="firstName" name="firstName" required>
      <label for="lastName">Last name *</label><input id="lastName" name="lastName" required>
      <label for="email">Email *</label><input id="email" name="email" type="email" aria-required="true">
      <label for="country">Country *</label><select id="country" name="country" required><option>Türkiye</option><option>Netherlands</option></select>
      <label for="cv">CV *</label><input id="cv" name="cv" type="file" required accept="application/pdf">
      <button type="submit">Submit application</button>
    </form>
  </main>
</body></html>
