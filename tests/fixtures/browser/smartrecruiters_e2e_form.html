<!doctype html>
<html>
<head><meta charset="utf-8"><title>SmartRecruiters End-to-End Fixture</title></head>
<body>
  <main>
    <h1>Business Analyst</h1>
    <form id="applicationForm">
      <label for="firstName">First name *</label><input id="firstName" name="firstName" type="text" required>
      <label for="lastName">Last name *</label><input id="lastName" name="lastName" type="text" required>
      <label for="email">Email *</label><input id="email" name="email" type="email" required>
      <label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required>
      <label for="linkedin">LinkedIn</label><input id="linkedin" name="linkedin" type="url">
      <label for="noticePeriod">Notice period *</label>
      <select id="noticePeriod" name="noticePeriod" required>
        <option value="">Select</option><option>2 weeks</option><option>4 weeks</option><option>8 weeks</option>
      </select>
      <label for="motivation">Motivation *</label><textarea id="motivation" name="motivation" maxlength="300" required></textarea>
      <label for="cv">CV *</label><input id="cv" name="cv" type="file" accept="application/pdf,.pdf" required>
      <button type="submit" id="submitApplication">Submit application</button>
    </form>
  </main>
</body>
</html>
