<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SmartRecruiters Application Fixture</title></head>
<body>
  <main>
    <h1>Business Analyst</h1>
    <form id="application-form" onsubmit="window.__submitted = true; return false;">
      <label for="firstName">First name *</label>
      <input id="firstName" name="firstName" type="text" autocomplete="given-name" required>

      <label for="lastName">Last name *</label>
      <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>

      <label for="email">Email *</label>
      <input id="email" name="email" type="email" autocomplete="email" aria-required="true">

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel">

      <label for="country">Country *</label>
      <select id="country" name="country" required>
        <option value="">Select</option><option>Türkiye</option><option>Netherlands</option>
      </select>

      <label for="cv">CV / Resume *</label>
      <input id="cv" name="cv" type="file" required>

      <label><input id="privacy" name="privacy" type="checkbox" required> I acknowledge the Privacy Notice *</label>
      <label><input id="marketing" name="marketing" type="checkbox"> Join the talent community</label>

      <label for="gender">Gender</label>
      <select id="gender" name="gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option></select>

      <button id="submitApplication" type="submit">Submit application</button>
    </form>
    <div id="submit-marker"></div>
  </main>
</body>
</html>
