name: GD-004 ADP Verified Session Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_verified_session_bootstrap.py'
      - 'src/ejs/services/adp_verified_session_inspector.py'
      - 'scripts/bootstrap_adp_verified_session.ps1'
      - 'scripts/lib/invoke_native_utf8_stdin.ps1'
      - '.github/workflows/gd004-adp-verified-session-inspector.yml'
      - 'tests/unit/test_adp_verified_session.py'
      - 'tests/scripts/test_gd004_bootstrap.ps1'
      - '.github/workflows/gd004-adp-verified-session-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/adp_verified_session_bootstrap.py'
      - 'src/ejs/services/adp_verified_session_inspector.py'
      - 'scripts/bootstrap_adp_verified_session.ps1'
      - 'scripts/lib/invoke_native_utf8_stdin.ps1'
      - '.github/workflows/gd004-adp-verified-session-inspector.yml'
      - 'tests/unit/test_adp_verified_session.py'
      - 'tests/scripts/test_gd004_bootstrap.ps1'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - name: Run verified-session unit tests
        run: python -m unittest discover -s tests/unit -p 'test_adp_verified_session.py' -v
      - name: Assert bootstrap and inspector authority boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          bootstrap = Path('src/ejs/services/adp_verified_session_bootstrap.py').read_text(encoding='utf-8')
          inspector = Path('src/ejs/services/adp_verified_session_inspector.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/gd004-adp-verified-session-inspector.yml').read_text(encoding='utf-8')
          helper = Path('scripts/bootstrap_adp_verified_session.ps1').read_text(encoding='utf-8')
          assert 'headless=False' in bootstrap
          assert 'Do not paste the code into this terminal' in bootstrap
          assert 'storage_state(path=' in bootstrap
          assert 'EJS_ADP_VERIFIED_STORAGE_STATE_JSON' in helper
          assert 'Invoke-GhSecretSetUtf8' in helper
          assert 'form_value_write_attempts": 0' in inspector
          assert 'credential_entry_attempts": 0' in inspector
          assert 'file_upload_attempts": 0' in inspector
          assert 'submit_attempts": 0' in inspector
          assert 'final_submit_allowed": False' in inspector
          assert '.fill(' not in inspector
          assert '.select_option(' not in inspector
          assert inspector.count('.click(') == 1, inspector.count('.click(')
          assert 'EJS_FILE_UPLOAD: "false"' in workflow
          assert 'EJS_FINAL_SUBMIT: "false"' in workflow
          assert 'EJS_KILL_SWITCH: "true"' in workflow
          assert 'APPROVE-TEST-ADP-VERIFIED-SESSION-INSPECT' in workflow
          assert 'credential_entry_attempts", 0) == 0' in workflow
          assert 'submit_attempts", 0) == 0' in workflow
          PY
