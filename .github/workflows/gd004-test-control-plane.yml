name: GD-004 TEST Signed Queue

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main SHA deployed to TEST Apps Script
        required: true
      queue_row:
        description: Explicit row in GD004 TEST Execution Queue
        required: true
      execution_id:
        description: Exact execution ID returned by the TEST-only initializer
        required: true

permissions:
  contents: read

concurrency:
  group: gd004-test-signed-queue
  cancel-in-progress: false

jobs:
  signed-queue:
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EJS_LIVE_READ_ONLY: 'true'
      EJS_FORM_WRITE: 'false'
      EJS_FILE_UPLOAD: 'false'
      EJS_FINAL_SUBMIT: 'false'
      EJS_HMAC_SHARED_SECRET_TEST: ${{ secrets.EJS_HMAC_SHARED_SECRET_TEST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify exact approved main and TEST-only authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          test "$EXPECTED_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EJS_LIVE_READ_ONLY" = "true"
          test "$EJS_FORM_WRITE" = "false"
          test "$EJS_FILE_UPLOAD" = "false"
          test "$EJS_FINAL_SUBMIT" = "false"
          test -n "$EJS_HMAC_SHARED_SECRET_TEST"
          test -n "${{ vars.EJS_APPS_SCRIPT_ZERO_COST_ID_TEST }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: npm install
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium

      - name: Materialize clasp mapping and OAuth auth for exact deployment discovery
        shell: bash
        env:
          SCRIPT_ID: ${{ vars.EJS_APPS_SCRIPT_ZERO_COST_ID_TEST }}
          CLASPRC_JSON: ${{ secrets.EJS_CLASPRC_JSON_TEST }}
        run: |
          test -n "$SCRIPT_ID"
          test -n "$CLASPRC_JSON"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > google_native/apps_script_zero_cost/.clasp.json
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Resolve exact-SHA Web App deployment
        id: deployment
        working-directory: google_native/apps_script_zero_cost
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          DESCRIPTION="EJS-GD004-ZERO-COST-TEST:${EXPECTED_SHA}"
          npx clasp list-deployments --json > deployments.json
          python ../../scripts/gd004/deployment_descriptor.py \
            --input deployments.json \
            --description-prefix "$DESCRIPTION" \
            --github-output >> "$GITHUB_OUTPUT"
          rm -f deployments.json

      - name: TEST-004B/C signed protocol plus one TEST queue execution
        env:
          EJS_APPS_SCRIPT_ZERO_COST_URL_TEST: ${{ steps.deployment.outputs.web_app_url }}
          SOURCE_SHA: ${{ inputs.expected_sha }}
          QUEUE_ROW: ${{ inputs.queue_row }}
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: |
          python -m ejs.apps.github_runner.queue_main \
            --source-sha "$SOURCE_SHA" \
            --queue-row "$QUEUE_ROW" \
            --execution-id "$EXECUTION_ID"

      - name: Confirm zero mutation authority
        if: always()
        shell: bash
        run: |
          test "$EJS_FORM_WRITE" = "false"
          test "$EJS_FILE_UPLOAD" = "false"
          test "$EJS_FINAL_SUBMIT" = "false"

      - name: Clean auth material
        if: always()
        shell: bash
        run: rm -f "$HOME/.clasprc.json" google_native/apps_script_zero_cost/.clasp.json google_native/apps_script_zero_cost/deployments.json
