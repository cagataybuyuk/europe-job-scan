name: GD-004 TEST Signed Queue

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved deployed main SHA
        required: true
      queue_row:
        description: Explicit row in GD004 TEST Execution Queue
        required: true
      execution_id:
        description: Exact execution ID printed by the owner-only initializer
        required: true

permissions:
  contents: read

concurrency:
  group: gd004-test-signed-queue
  cancel-in-progress: false

jobs:
  signed-queue:
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify exact approved main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          test "$EXPECTED_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: TEST-004B/C signed protocol and one TEST queue row
        env:
          EJS_APPS_SCRIPT_ZERO_COST_URL_TEST: ${{ vars.EJS_APPS_SCRIPT_ZERO_COST_URL_TEST }}
          EJS_HMAC_SHARED_SECRET_TEST: ${{ secrets.EJS_HMAC_SHARED_SECRET_TEST }}
          EJS_LIVE_READ_ONLY: 'true'
          EJS_FORM_WRITE: 'false'
          EJS_FILE_UPLOAD: 'false'
          EJS_FINAL_SUBMIT: 'false'
          SOURCE_SHA: ${{ inputs.expected_sha }}
          QUEUE_ROW: ${{ inputs.queue_row }}
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: |
          python -m ejs.apps.github_runner.queue_main \
            --source-sha "$SOURCE_SHA" --queue-row "$QUEUE_ROW" --execution-id "$EXECUTION_ID"
