name: GD-004 Offline Shadow Step Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/shadow_fixture_step_adapter.py'
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'tests/unit/test_shadow_fixture_step_adapter.py'
      - '.github/workflows/gd004-shadow-step-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/shadow_fixture_step_adapter.py'
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'tests/unit/test_shadow_fixture_step_adapter.py'
      - '.github/workflows/gd004-shadow-step-regression.yml'
permissions:
  contents: read
jobs:
  offline-step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/unit -p test_shadow_fixture_step_adapter.py -v
