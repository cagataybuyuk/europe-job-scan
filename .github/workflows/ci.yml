name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every workflow including manual-only canaries
        run: bash scripts/ci/lint_workflows.sh
      - run: python scripts/ci/secret_scan.py
      - run: python scripts/ci/verify_authority_boundaries.py
      - name: Validate TEST provisioning shell syntax
        run: |
          bash -n google_native/cloud_run/deploy/bootstrap_test.sh
          bash -n infra/cloud-run/provision_github_wif_test.sh
      - name: Validate GD-004 user bootstrap PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/gd004/bootstrap_zero_cost_user_trust.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Assert Cloud Run TEST workflow remains keyless and private
        run: |
          ! grep -Eq 'credentials_json|service-account-key' .github/workflows/deploy-test-cloud-run.yml
          ! grep -Eq -- '(^|[[:space:]])--allow-unauthenticated([[:space:]]|$)' .github/workflows/deploy-test-cloud-run.yml
          grep -q -- '--no-allow-unauthenticated' .github/workflows/deploy-test-cloud-run.yml
          grep -q 'workload_identity_provider' .github/workflows/deploy-test-cloud-run.yml
          grep -q -- '--service-account' .github/workflows/deploy-test-cloud-run.yml
      - name: Assert GD-004 zero-cost safety boundary
        run: |
          grep -q "EJS_LIVE_READ_ONLY: 'true'" .github/workflows/gd004-test-browser.yml
          grep -q "EJS_FORM_WRITE: 'false'" .github/workflows/gd004-test-browser.yml
          grep -q "EJS_FILE_UPLOAD: 'false'" .github/workflows/gd004-test-browser.yml
          grep -q "EJS_FINAL_SUBMIT: 'false'" .github/workflows/gd004-test-browser.yml
          grep -q "EJS_KILL_SWITCH: 'true'" .github/workflows/gd004-test-browser.yml
          grep -q "EJS_LIVE_READ_ONLY: 'true'" .github/workflows/gd004-test-control-plane.yml
          grep -q "EJS_FORM_WRITE: 'false'" .github/workflows/gd004-test-control-plane.yml
          grep -q "EJS_FILE_UPLOAD: 'false'" .github/workflows/gd004-test-control-plane.yml
          grep -q "EJS_FINAL_SUBMIT: 'false'" .github/workflows/gd004-test-control-plane.yml
          grep -q 'EJS_HMAC_SHARED_SECRET_TEST' .github/workflows/gd004-test-control-plane.yml
          ! grep -q 'EJS_GH_HMAC_SECRET_TEST' .github/workflows/gd004-test-control-plane.yml
          ! grep -q 'cloud-platform' google_native/apps_script_zero_cost/appsscript.json
          grep -q 'https://www.googleapis.com/auth/drive.readonly' google_native/apps_script_zero_cost/appsscript.json
          grep -q '"access": "ANYONE_ANONYMOUS"' google_native/apps_script_zero_cost/appsscript.json
          grep -q '"executeAs": "USER_DEPLOYING"' google_native/apps_script_zero_cost/appsscript.json
          grep -q "GD004_FINAL_SUBMIT_FORBIDDEN" google_native/apps_script_zero_cost/EjsGitHubGatewayV1.gs
          grep -q "GD004_FILE_UPLOAD_FORBIDDEN" google_native/apps_script_zero_cost/EjsGitHubGatewayV1.gs
          grep -q "GD004_FORM_WRITE_FORBIDDEN" google_native/apps_script_zero_cost/EjsGitHubGatewayV1.gs
          grep -q 'create-deployment' .github/workflows/deploy-test-apps-script-zero-cost.yml
          grep -q 'list-deployments' .github/workflows/deploy-test-apps-script-zero-cost.yml
          grep -q 'EJS_GH_DEPLOYED_SOURCE_SHA_V1' .github/workflows/deploy-test-apps-script-zero-cost.yml
          grep -q 'EJS_HMAC_SHARED_SECRET_TEST' scripts/gd004/bootstrap_zero_cost_user_trust.ps1
          ! grep -q 'EJS_GH_HMAC_SECRET_TEST' scripts/gd004/bootstrap_zero_cost_user_trust.ps1
          grep -q 'gd004-safe-fill-upload-canary' .github/workflows/gd004-safe-fill-upload-canary.yml
          grep -q "EJS_FINAL_SUBMIT: 'false'" .github/workflows/gd004-safe-fill-upload-canary.yml
          grep -q "EJS_KILL_SWITCH: 'true'" .github/workflows/gd004-safe-fill-upload-canary.yml
          grep -q 'gd004-r2-submit-review' .github/workflows/gd004-r2-submit-release-gate.yml
          grep -q "EJS_FINAL_SUBMIT: 'false'" .github/workflows/gd004-r2-submit-release-gate.yml
          grep -q 'READY_FOR_MANUAL_ENVIRONMENT_REVIEW' src/ejs/apps/github_runner/canary_policy.py

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Run core regression tests
        run: >-
          python -m pytest -q
          tests/unit/test_connector_capture.py
          tests/unit/test_decision_shadow.py
          tests/unit/test_environment.py
          tests/unit/test_freeze.py
          tests/unit/test_google_native_gd002.py
          tests/unit/test_mw3_append_only.py
          tests/unit/test_mw4a_derived_state.py
          tests/unit/test_mw4b_canary.py
          tests/unit/test_mw4c_user_action_projection.py
          tests/unit/test_mw5_executor.py
          tests/unit/test_mw5_guarded_mutation.py
          tests/unit/test_read_fence.py
          tests/unit/test_resource_router.py
          tests/unit/test_resource_router_smoke.py
          tests/unit/test_offline_task_manifest.py
          tests/unit/test_shadow.py
          tests/unit/test_submit1_policy.py
          tests/unit/test_tmh1_history.py
          tests/test_live_canary_manifest.py
          tests/test_mvp04_vacancy_evidence_gate.py
          tests/test_mvp05_answer_provenance_gate.py
          tests/test_mvp06_cv_asset_gate.py
          tests/test_submission_ledger.py
          tests/test_durable_submission.py
          tests/test_single_application_inputs.py
          tests/test_oneclick_target.py
          tests/test_single_application_runtime.py
          tests/test_application_outcome.py
          tests/test_single_application_bootstrap.py
          tests/test_retained_entry_controller.py
          tests/test_reviewed_application_scope.py
          tests/test_central_application_outcome.py
          tests/test_reviewed_execution_scope.py
          tests/test_reviewed_scope_ledger.py
          tests/test_reviewed_scope_outcomes.py
          tests/test_reviewed_application_bootstrap.py
          tests/test_work_rights_evidence_gate.py
          tests/test_bound_work_rights_gate.py
          tests/test_application_action_preflight.py

  mvp01-render-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run MVP-01 render-wait negative tests
        run: python -m pytest -q tests/test_mvp01_render_structure_wait.py

  mvp02-network-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run MVP-02 redacted network diagnostics negative tests
        run: python -m pytest -q tests/test_mvp02_network_evidence.py

  mvp03-observation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run MVP-03 malformed observation and privacy tests
        run: python -m pytest -q tests/test_mvp03_observation_boundaries.py tests/unit/test_smartrecruiters_shadow.py tests/test_mvp03_frame_observation_guard.py tests/test_mvp03_dynamic_render_signals.py tests/test_mvp03_human_handoff_contract.py tests/test_mvp03_captcha_precedence.py tests/test_mvp03_multistep_boundary.py

  browser-prefill-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run 38 browser/prefill tests
        run: python -m pytest -q tests/unit/test_be1_browser_worker.py tests/unit/test_be2_safe_field_writer.py

  upload-e2e-regression:
    runs-on: ubuntu-latest
    # Bound the job so a runner stuck after test completion cannot block a PR indefinitely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run 40 upload/E2E tests
        run: python -m pytest -q tests/unit/test_file1_upload_runtime.py tests/unit/test_smartrecruiters_e2e.py tests/test_prepare_network_fence.py tests/test_fenced_application_session.py tests/test_durable_submission_browser.py tests/test_oneclick_browser.py
      - name: Run SmartRecruiters bounded read-only application-entry tests
        run: python -m pytest -q tests/unit/test_smartrecruiters_live_inspector.py tests/unit/test_smartrecruiters_live_route.py

  gd004-zero-cost-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run GD-004 signed contract tests
        run: python -m pytest -q tests/unit/test_gd004_contract.py
      - name: Run GD-004 deployment descriptor tests
        run: python -m pytest -q tests/unit/test_gd004_deployment_descriptor.py
      - name: Run actual Apps Script source in V8
        run: node --test tests/node/gd004_gateway.test.cjs tests/node/central_outcome_sync.test.cjs
      - name: Run Python to Apps Script queue and asset integration
        run: python -m pytest -q tests/unit/test_gd004_queue.py tests/unit/test_gd004_queue_browser.py
      - name: Run GD-004 GitHub-hosted Chromium smoke
        run: python -m pytest -q tests/unit/test_gd004_browser.py

