name: GD-004 Live Inspector Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/smartrecruiters_live_inspector.py'
      - 'src/ejs/services/smartrecruiters_live_route.py'
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'tests/unit/test_smartrecruiters_live_inspector.py'
      - 'tests/unit/test_smartrecruiters_live_route.py'
      - '.github/workflows/gd004-live-inspection.yml'
      - '.github/workflows/gd004-live-inspector-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/smartrecruiters_live_inspector.py'
      - 'src/ejs/services/smartrecruiters_live_route.py'
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'tests/unit/test_smartrecruiters_live_inspector.py'
      - 'tests/unit/test_smartrecruiters_live_route.py'
      - '.github/workflows/gd004-live-inspection.yml'
      - '.github/workflows/gd004-live-inspector-regression.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/unit -p 'test_smartrecruiters_live_*.py' -v
