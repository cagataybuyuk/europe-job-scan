name: GD-004 ADP Navigation Canary Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_navigation_canary.py'
      - 'tests/unit/test_adp_navigation_canary.py'
      - '.github/workflows/gd004-adp-navigation-canary.yml'
      - '.github/workflows/gd004-adp-navigation-canary-regression.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/unit -p 'test_adp_navigation_canary.py' -v
      - name: Assert exactly-one-click source boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('src/ejs/services/adp_navigation_canary.py').read_text(encoding='utf-8')
          assert src.count('.click(') == 1, src.count('.click(')
          assert 'force=True' not in src
          assert '.fill(' not in src
          assert '.type(' not in src
          assert 'set_input_files' not in src
          assert '.submit(' not in src
          assert 'credential_entry_attempts": 0' in src
          assert 'form_value_write_attempts": 0' in src
          assert 'file_upload_attempts": 0' in src
          assert 'submit_attempts": 0' in src
          assert 'safe_fill_allowed": False' in src
          assert 'final_submit_allowed": False' in src
          PY
