name: GD-003 One-Shot Migration Materializer

on:
  push:
    branches:
      - migration/github-cicd-baseline
    paths:
      - 'migration/bundle/part11'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/github-cicd-baseline
          fetch-depth: 0
      - name: Reconstruct approved staged source
        shell: bash
        run: |
          set -euo pipefail
          cat migration/bundle/part00 migration/bundle/part01 migration/bundle/part02 migration/bundle/part03 migration/bundle/part04 migration/bundle/part05 migration/bundle/part06 migration/bundle/part07 migration/bundle/part08 migration/bundle/part09 migration/bundle/part10 migration/bundle/part11 > /tmp/ejs_stage.b64
          base64 --decode /tmp/ejs_stage.b64 > /tmp/ejs_stage.zip
          echo '4ac31ee4e71108d8e5e7083f74fe0ceb7745f54b43cd1e964b50d9f173b73a40  /tmp/ejs_stage.zip' | sha256sum -c -
          rm -rf /tmp/ejs_stage
          mkdir -p /tmp/ejs_stage
          unzip -q /tmp/ejs_stage.zip -d /tmp/ejs_stage
          rsync -a --delete --exclude='.git/' --exclude='migration/' /tmp/ejs_stage/ ./
      - name: Remove one-shot bootstrap artifacts
        shell: bash
        run: |
          rm -rf migration/bundle
          rm -f .github/workflows/bootstrap-gd003-migration.yml
          rm -f .github/CANONICAL_SOURCE_PENDING
      - name: Validate guards before commit
        shell: bash
        run: |
          python scripts/ci/secret_scan.py
          python scripts/ci/verify_authority_boundaries.py
      - name: Commit canonical migration tree
        shell: bash
        run: |
          git config user.name 'ejs-gd003-bot'
          git config user.email '74713279+cagataybuyuk@users.noreply.github.com'
          git add -A
          git commit -m 'feat(gd-003): migrate 0.12.0a1 canonical source and CI/CD'
          git push origin HEAD:migration/github-cicd-baseline
