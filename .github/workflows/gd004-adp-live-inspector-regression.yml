name: GD-004 ADP Live Inspector Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_live_inspector.py'
      - 'src/ejs/services/adp_live_route.py'
      - 'tests/unit/test_adp_live_inspector.py'
      - '.github/workflows/gd004-adp-live-inspection.yml'
      - '.github/workflows/gd004-adp-live-inspector-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/adp_live_inspector.py'
      - 'src/ejs/services/adp_live_route.py'
      - 'tests/unit/test_adp_live_inspector.py'
      - '.github/workflows/gd004-adp-live-inspection.yml'
      - '.github/workflows/gd004-adp-live-inspector-regression.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/unit -p 'test_adp_live_inspector.py' -v
      - name: Assert ADP live inspector source remains read-only
        shell: bash
        run: |
          ! grep -Eq '\.(click|fill|type|check|select_option|set_input_files)\(' src/ejs/services/adp_live_inspector.py
          ! grep -Eq 'page\.evaluate\([^)]*(value|files|localStorage|sessionStorage|cookie)' src/ejs/services/adp_live_inspector.py
          grep -q 'navigation_click_attempts.*0' src/ejs/services/adp_live_inspector.py
          grep -q 'credential_entry_attempts.*0' src/ejs/services/adp_live_inspector.py
          grep -q 'form_value_write_attempts.*0' src/ejs/services/adp_live_inspector.py
          grep -q 'file_upload_attempts.*0' src/ejs/services/adp_live_inspector.py
          grep -q 'submit_attempts.*0' src/ejs/services/adp_live_inspector.py
