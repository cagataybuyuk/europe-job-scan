name: GD-004 ADP Cookie Preferences Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_cookie_preferences_canary.py'
      - 'tests/unit/test_adp_cookie_preferences_canary.py'
      - '.github/workflows/gd004-adp-cookie-preferences-canary.yml'
      - '.github/workflows/gd004-adp-cookie-preferences-regression.yml'
      - 'docs/GD004_ADP_COOKIE_PREFERENCES_CANARY.md'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/adp_cookie_preferences_canary.py'
      - 'tests/unit/test_adp_cookie_preferences_canary.py'
      - '.github/workflows/gd004-adp-cookie-preferences-canary.yml'
      - '.github/workflows/gd004-adp-cookie-preferences-regression.yml'
      - 'docs/GD004_ADP_COOKIE_PREFERENCES_CANARY.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/unit -p 'test_adp_cookie_preferences_canary.py' -v
      - name: Assert one-click read-only authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('src/ejs/services/adp_cookie_preferences_canary.py').read_text(encoding='utf-8')
          assert src.count('.click(') == 1, src.count('.click(')
          assert '.fill(' not in src
          assert 'set_input_files(' not in src
          assert 'select_option(' not in src
          assert 'force=True' not in src
          assert '.press(' not in src
          assert '.check(' not in src
          assert '.uncheck(' not in src
          assert 'PREFERENCES_LABEL = "To manage your preferences, click here"' in src
          assert 'PREFERENCES_BUTTON_ID = "onetrust-pc-btn-handler"' in src
          assert '"Set your preferences"' in src
          assert '"To manage your preferences, click here"' in src
          assert 'reviewed_preferences_button(page)' in src
          assert 'safe_fill_allowed": False' in src
          assert 'final_submit_allowed": False' in src
          wf = Path('.github/workflows/gd004-adp-cookie-preferences-canary.yml').read_text(encoding='utf-8')
          assert "EJS_FORM_WRITE: 'false'" in wf
          assert "EJS_FILE_UPLOAD: 'false'" in wf
          assert "EJS_FINAL_SUBMIT: 'false'" in wf
          assert "EJS_KILL_SWITCH: 'true'" in wf
          assert 'APPROVE-TEST-ADP-OPEN-COOKIE-PREFERENCES' in wf
          PY
