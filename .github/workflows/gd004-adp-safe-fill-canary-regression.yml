name: GD-004 ADP Safe-Fill Canary Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_safe_fill_canary.py'
      - 'tests/unit/test_adp_safe_fill_canary.py'
      - '.github/workflows/gd004-adp-safe-fill-canary.yml'
      - '.github/workflows/gd004-adp-safe-fill-canary-regression.yml'
      - 'docs/GD004_ADP_SAFE_FILL_CANARY.md'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/adp_safe_fill_canary.py'
      - 'tests/unit/test_adp_safe_fill_canary.py'
      - '.github/workflows/gd004-adp-safe-fill-canary.yml'
      - '.github/workflows/gd004-adp-safe-fill-canary-regression.yml'
      - 'docs/GD004_ADP_SAFE_FILL_CANARY.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/unit -p 'test_adp_safe_fill_canary.py' -v
      - name: Assert bounded source authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('src/ejs/services/adp_safe_fill_canary.py').read_text(encoding='utf-8')
          assert src.count('.click(') == 1, src.count('.click(')
          assert src.count('.fill(') == 1, src.count('.fill(')
          assert 'set_input_files(' not in src
          assert 'select_option(' not in src
          assert 'force=True' not in src
          assert '.press(' not in src
          assert '.check(' not in src
          assert '.uncheck(' not in src
          assert 'final_submit_allowed": False' in src
          wf = Path('.github/workflows/gd004-adp-safe-fill-canary.yml').read_text(encoding='utf-8')
          assert "EJS_FILE_UPLOAD: 'false'" in wf
          assert "EJS_FINAL_SUBMIT: 'false'" in wf
          assert "EJS_KILL_SWITCH: 'true'" in wf
          assert 'APPROVE-TEST-ADP-IDENTITY-SAFE-FILL' in wf
          assert 'EJS_LIVE_CANARY_MANIFEST_JSON' in wf
          PY
