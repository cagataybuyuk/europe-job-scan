name: GD-004 ADP Cookie Preferences Inspector

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable main SHA to execute
        required: true
        type: string
      target_url:
        description: Approved HTTPS ADP Workforce Now application URL
        required: true
        type: string
      expected_navigation_surface_fingerprint:
        description: Exact approved pre-navigation surface fingerprint
        required: true
        type: string
      approval_phrase:
        description: Type APPROVE-TEST-ADP-OPEN-COOKIE-PREFERENCES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gd004-adp-cookie-preferences-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gd004-safe-fill-upload-canary
    env:
      EJS_FORM_WRITE: 'false'
      EJS_FILE_UPLOAD: 'false'
      EJS_FINAL_SUBMIT: 'false'
      EJS_KILL_SWITCH: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Assert immutable one-click inspection boundary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVAL: ${{ inputs.approval_phrase }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$APPROVAL" = "APPROVE-TEST-ADP-OPEN-COOKIE-PREFERENCES"
          test "$EJS_FORM_WRITE" = "false"
          test "$EJS_FILE_UPLOAD" = "false"
          test "$EJS_FINAL_SUBMIT" = "false"
          test "$EJS_KILL_SWITCH" = "true"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium

      - name: Open preference center once and inspect read-only surface
        env:
          TARGET_URL: ${{ inputs.target_url }}
          EXPECTED_NAV_FP: ${{ inputs.expected_navigation_surface_fingerprint }}
        shell: bash
        run: |
          set +e
          python -m ejs.services.adp_cookie_preferences_canary \
            --url "$TARGET_URL" \
            --expected-navigation-surface-fingerprint "$EXPECTED_NAV_FP" \
            --output adp-cookie-preferences-canary.json
          status=$?
          echo "CANARY_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Reassert one-click and zero-mutation authority
        env:
          EXPECTED_NAV_FP: ${{ inputs.expected_navigation_surface_fingerprint }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('adp-cookie-preferences-canary.json', encoding='utf-8'))
          assert report.get('cookie_preferences_inspection_only') is True
          assert report.get('expected_navigation_surface_fingerprint') == os.environ['EXPECTED_NAV_FP']
          assert report.get('preference_navigation_click_attempts', 0) <= 1
          assert report.get('preference_navigation_click_successes', 0) <= 1
          assert report.get('cookie_toggle_write_attempts', 0) == 0
          assert report.get('cookie_save_attempts', 0) == 0
          assert report.get('cookie_accept_attempts', 0) == 0
          assert report.get('cookie_reject_attempts', 0) == 0
          assert report.get('application_navigation_click_attempts', 0) == 0
          assert report.get('credential_entry_attempts', 0) == 0
          assert report.get('form_value_write_attempts', 0) == 0
          assert report.get('file_upload_attempts', 0) == 0
          assert report.get('submit_attempts', 0) == 0
          assert report.get('safe_fill_allowed') is False
          assert report.get('file_upload_allowed') is False
          assert report.get('final_submit_allowed') is False
          PY

      - name: Upload non-secret preference-center evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gd004-adp-cookie-preferences-${{ github.run_id }}
          path: adp-cookie-preferences-canary.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed when preference center was not inspected
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('adp-cookie-preferences-canary.json', encoding='utf-8'))
          assert os.environ.get('CANARY_EXIT_CODE') == '0'
          assert report.get('canary_status') == 'inspected'
          assert report.get('preference_navigation_click_attempts') == 1
          assert report.get('preference_navigation_click_successes') == 1
          assert report.get('cookie_toggle_write_attempts', 0) == 0
          assert report.get('application_navigation_click_attempts', 0) == 0
          assert report.get('form_value_write_attempts', 0) == 0
          assert report.get('file_upload_attempts', 0) == 0
          assert report.get('submit_attempts', 0) == 0
          PY
