name: GD-004 ADP Continue Diagnostic Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_continue_diagnostic_canary.py'
      - 'tests/unit/test_adp_continue_diagnostic_canary.py'
      - '.github/workflows/gd004-adp-continue-diagnostic-canary.yml'
      - '.github/workflows/gd004-adp-continue-diagnostic-regression.yml'
      - 'docs/GD004_ADP_CONTINUE_DIAGNOSTICS.md'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/unit -p 'test_adp_continue_diagnostic_canary.py' -v
      - name: Assert reviewed five-click, three-field, read-only-diagnostics authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/ejs/services/adp_continue_diagnostic_canary.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/gd004-adp-continue-diagnostic-canary.yml').read_text(encoding='utf-8')
          assert source.count('.click(') == 5
          assert source.count('.fill(') == 1
          assert '.set_input_files(' not in source
          assert 'force=True' not in source
          assert '.check(' not in source
          assert '.uncheck(' not in source
          assert 'submit_attempts' in source
          assert 'file_upload_attempts' in source
          assert 'optional_cookie_accept_attempts' in source
          assert 'sanitize_text' in source
          assert 'EJS_FILE_UPLOAD: \'false\'' in workflow
          assert 'EJS_FINAL_SUBMIT: \'false\'' in workflow
          assert 'EJS_KILL_SWITCH: \'true\'' in workflow
          assert 'APPROVE-TEST-ADP-CONTINUE-DIAGNOSTICS' in workflow
          assert 'EJS_ADP_CANARY_PROFILE_JSON' in workflow
          PY
