name: Deploy TEST Cloud Run

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA approved for TEST deployment
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Assert exact immutable source and required variables
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -n "${{ vars.GCP_PROJECT_ID_TEST }}"
          test -n "${{ vars.GCP_WIF_PROVIDER_TEST }}"
          test -n "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_TEST }}"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_TEST }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_TEST }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_TEST }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 416.0.0'
      - name: Verify keyless federated identity
        shell: bash
        env:
          EXPECTED_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_TEST }}
        run: |
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$ACTIVE_ACCOUNT" = "$EXPECTED_DEPLOY_SA"
      - name: Build and deploy exact TEST revision
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID_TEST }}
          REGION: europe-west1
          SERVICE: ejs-browser-worker-test
          REPO: ejs-browser-test
          SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          RUNTIME_SA="ejs-browser-runtime-test@${PROJECT_ID}.iam.gserviceaccount.com"
          INVOKER_SA="ejs-appscript-invoker-test@${PROJECT_ID}.iam.gserviceaccount.com"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/ejs-browser-worker:${SHA}"
          gcloud builds submit --project "$PROJECT_ID" --tag "$IMAGE" .
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --min 0 --max 1 --concurrency 1 --cpu 1 --memory 2Gi --timeout 180 \
            --set-env-vars="EJS_BUILD_SHA=${SHA}"
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --member="serviceAccount:${INVOKER_SA}" \
            --role="roles/run.invoker" >/dev/null
      - name: Independent TEST deployment readback
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID_TEST }}
          REGION: europe-west1
          SERVICE: ejs-browser-worker-test
          SHA: ${{ inputs.expected_sha }}
          EXPECTED_RUNTIME_SA: ejs-browser-runtime-test@${{ vars.GCP_PROJECT_ID_TEST }}.iam.gserviceaccount.com
          EXPECTED_INVOKER_SA: ejs-appscript-invoker-test@${{ vars.GCP_PROJECT_ID_TEST }}.iam.gserviceaccount.com
          EXPECTED_IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_TEST }}/ejs-browser-test/ejs-browser-worker:${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/ejs-service.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/ejs-policy.json
          python - <<'PY'
          import json, os
          with open('/tmp/ejs-service.json', encoding='utf-8') as handle:
              service = json.load(handle)
          with open('/tmp/ejs-policy.json', encoding='utf-8') as handle:
              policy = json.load(handle)
          spec = service['spec']['template']['spec']
          containers = spec['containers']
          assert len(containers) == 1, containers
          container = containers[0]
          assert spec['serviceAccountName'] == os.environ['EXPECTED_RUNTIME_SA']
          assert container['image'] == os.environ['EXPECTED_IMAGE']
          env = {item['name']: item.get('value') for item in container.get('env', [])}
          assert env.get('EJS_BUILD_SHA') == os.environ['SHA'], env
          members = []
          public = []
          for binding in policy.get('bindings', []):
              if binding.get('role') == 'roles/run.invoker':
                  members.extend(binding.get('members', []))
              public.extend(m for m in binding.get('members', []) if m in {'allUsers', 'allAuthenticatedUsers'})
          assert f"serviceAccount:{os.environ['EXPECTED_INVOKER_SA']}" in members, members
          assert not public, public
          print('cloud-run-test-readback: PASS')
          print('latest_ready_revision=' + service['status']['latestReadyRevisionName'])
          print('service_url=' + service['status']['url'])
          PY
