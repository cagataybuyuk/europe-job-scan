name: GD-004 ADP Phone Contract Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_phone_contract_canary.py'
      - 'tests/unit/test_adp_phone_contract_canary.py'
      - '.github/workflows/gd004-adp-phone-contract-canary.yml'
      - '.github/workflows/gd004-adp-phone-contract-regression.yml'
      - 'docs/GD004_ADP_PHONE_CONTRACT_CANARY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run ADP phone contract tests
        run: python -m unittest discover -s tests/unit -p 'test_adp_phone_contract_canary.py' -v
      - name: Assert four-click zero-profile-write authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/ejs/services/adp_phone_contract_canary.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/gd004-adp-phone-contract-canary.yml').read_text(encoding='utf-8')
          assert source.count('.click(') == 4
          for token in ('.fill(', 'set_input_files', 'select_option(', '.press(', '.check(', '.uncheck(', 'force=True'):
              assert token not in source, token
          assert 'phone_write_allowed": False' in source
          assert 'continue_click_allowed": False' in source
          assert 'file_upload_allowed": False' in source
          assert 'final_submit_allowed": False' in source
          assert "EJS_FORM_WRITE: 'false'" in workflow
          assert "EJS_FILE_UPLOAD: 'false'" in workflow
          assert "EJS_FINAL_SUBMIT: 'false'" in workflow
          assert "EJS_KILL_SWITCH: 'true'" in workflow
          assert 'APPROVE-TEST-ADP-PHONE-CONTRACT-INSPECTION' in workflow
          PY
