name: GD-004 ADP Profile V2 Continue Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_profile_v2_continue_canary.py'
      - 'src/ejs/services/adp_profile_policy.py'
      - 'src/ejs/services/adp_phone_contract_canary.py'
      - 'tests/unit/test_adp_profile_v2_continue_canary.py'
      - '.github/workflows/gd004-adp-profile-v2-continue-canary.yml'
      - '.github/workflows/gd004-adp-profile-v2-continue-regression.yml'
      - 'docs/GD004_ADP_PROFILE_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run profile-v2 Continue unit tests
        run: python -m unittest discover -s tests/unit -p 'test_adp_profile_v2_continue_canary.py' -v
      - name: Assert reviewed five-click five-write authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ejs/services/adp_profile_v2_continue_canary.py')
          text = p.read_text(encoding='utf-8')
          assert text.count('.click(') == 5, text.count('.click(')
          assert text.count('.select_option(') == 1, text.count('.select_option(')
          assert text.count('.fill(') == 2, text.count('.fill(')
          forbidden = (
              'set_input_files(', '.check(', '.uncheck(', 'force=True',
              'get_by_text("Sign in', 'get_by_text("Submit', 'final_submit = True',
          )
          found = [token for token in forbidden if token in text]
          assert not found, found
          workflow = Path('.github/workflows/gd004-adp-profile-v2-continue-canary.yml').read_text(encoding='utf-8')
          assert "EJS_FILE_UPLOAD: 'false'" in workflow
          assert "EJS_FINAL_SUBMIT: 'false'" in workflow
          assert "EJS_KILL_SWITCH: 'true'" in workflow
          assert "EJS_OPTIONAL_COOKIE_ACCEPT: 'false'" in workflow
          assert 'form_value_write_attempts' in workflow and '<= 5' in workflow
          assert 'APPROVE-TEST-ADP-PROFILE-V2-PHONE-AND-CONTINUE' in workflow
          PY
