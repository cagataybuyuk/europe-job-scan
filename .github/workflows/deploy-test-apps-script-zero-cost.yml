name: Deploy TEST Apps Script Zero Cost

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA approved for TEST deployment
        required: true
  push:
    branches: [main]
    paths:
      - 'google_native/apps_script_zero_cost/**'
      - 'src/ejs/contracts/github_executor.py'
      - 'src/ejs/services/apps_script_control_plane.py'
      - 'src/ejs/apps/github_runner/control_plane_smoke.py'

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

      - name: Resolve immutable source and bootstrap metadata
        id: metadata
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          if [ ! -f infra/runtime/test_apps_script_zero_cost.json ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Apps Script TEST bootstrap metadata absent; deploy is a safe no-op.'
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('infra/runtime/test_apps_script_zero_cost.json'))
          assert d['environment']=='TEST'
          assert d['contract_version']=='EJS-GH-EXEC-0.1'
          print('ready=true')
          print('script_id='+d['script_id'])
          print('deployment_id='+d['deployment_id'])
          print('webapp_url='+d['webapp_url'])
          PY

      - name: Assert zero-cost authority boundary
        if: steps.metadata.outputs.ready == 'true'
        shell: bash
        run: |
          ! grep -q "cloud-platform" google_native/apps_script_zero_cost/appsscript.json
          grep -q '"access": "ANYONE_ANONYMOUS"' google_native/apps_script_zero_cost/appsscript.json
          grep -q '"executeAs": "USER_DEPLOYING"' google_native/apps_script_zero_cost/appsscript.json
          grep -q "GD004_FINAL_SUBMIT_FORBIDDEN" google_native/apps_script_zero_cost/EjsGitHubGatewayV1.gs
          grep -q "GD004_FILE_UPLOAD_FORBIDDEN" google_native/apps_script_zero_cost/EjsGitHubGatewayV1.gs
          grep -q "GD004_FORM_WRITE_FORBIDDEN" google_native/apps_script_zero_cost/EjsGitHubGatewayV1.gs

      - uses: actions/setup-node@v4
        if: steps.metadata.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.metadata.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: npm install
        if: steps.metadata.outputs.ready == 'true'
      - run: python -m pip install -e '.[test]'
        if: steps.metadata.outputs.ready == 'true'

      - name: Materialize clasp TEST mapping and OAuth auth
        if: steps.metadata.outputs.ready == 'true'
        shell: bash
        env:
          SCRIPT_ID: ${{ steps.metadata.outputs.script_id }}
          CLASPRC_JSON: ${{ secrets.EJS_CLASPRC_JSON_TEST }}
        run: |
          test -n "$SCRIPT_ID"
          test -n "$CLASPRC_JSON"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > google_native/apps_script_zero_cost/.clasp.json
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push canonical source and update existing web app deployment
        if: steps.metadata.outputs.ready == 'true'
        env:
          DEPLOYMENT_ID: ${{ steps.metadata.outputs.deployment_id }}
        shell: bash
        run: |
          cd google_native/apps_script_zero_cost
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" push --force
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" create-deployment --deploymentId "$DEPLOYMENT_ID" --description "GD-004 TEST ${GITHUB_SHA}"

      - name: Post-deploy signed control-plane smoke
        if: steps.metadata.outputs.ready == 'true'
        env:
          EJS_HMAC_SHARED_SECRET_TEST: ${{ secrets.EJS_HMAC_SHARED_SECRET_TEST }}
          WEBAPP_URL: ${{ steps.metadata.outputs.webapp_url }}
        shell: bash
        run: python -m ejs.apps.github_runner.control_plane_smoke --url "$WEBAPP_URL" --source-sha "${{ steps.metadata.outputs.expected_sha }}"

      - name: Clean auth material
        if: always()
        shell: bash
        run: rm -f "$HOME/.clasprc.json" google_native/apps_script_zero_cost/.clasp.json
