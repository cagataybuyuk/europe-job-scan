name: GD-004 ADP One-click Navigation Canary

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable main SHA to execute
        required: true
        type: string
      target_url:
        description: Approved HTTPS ADP Workforce Now application URL
        required: true
        type: string
      expected_navigation_surface_fingerprint:
        description: Stable visible Apply-surface fingerprint from reviewed read-only evidence
        required: true
        type: string
      entry_ordinal:
        description: Zero-based approved visible Apply ordinal within the reviewed surface
        required: true
        type: string
      approval_phrase:
        description: Type APPROVE-TEST-ADP-ONE-CLICK-NAVIGATION
        required: true
        type: string

permissions:
  contents: read

jobs:
  navigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EJS_FINAL_SUBMIT: 'false'
      EJS_KILL_SWITCH: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Assert immutable one-click boundary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVAL: ${{ inputs.approval_phrase }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$APPROVAL" = "APPROVE-TEST-ADP-ONE-CLICK-NAVIGATION"
          test "$EJS_FINAL_SUBMIT" = "false"
          test "$EJS_KILL_SWITCH" = "true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Execute exactly one approved Apply navigation click
        env:
          TARGET_URL: ${{ inputs.target_url }}
          EXPECTED_SURFACE_FP: ${{ inputs.expected_navigation_surface_fingerprint }}
          ENTRY_ORDINAL: ${{ inputs.entry_ordinal }}
        run: |
          python -m ejs.services.adp_navigation_canary \
            --url "$TARGET_URL" \
            --expected-navigation-surface-fingerprint "$EXPECTED_SURFACE_FP" \
            --entry-ordinal "$ENTRY_ORDINAL" \
            --expected-label "Apply" \
            --output adp-navigation-canary.json
      - name: Reassert one-click-only authority and zero application mutation
        env:
          EXPECTED_SURFACE_FP: ${{ inputs.expected_navigation_surface_fingerprint }}
          ENTRY_ORDINAL: ${{ inputs.entry_ordinal }}
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('adp-navigation-canary.json', encoding='utf-8'))
          assert report.get('navigation_canary_only') is True
          assert report.get('expected_navigation_surface_fingerprint') == os.environ['EXPECTED_SURFACE_FP']
          assert report.get('approved_entry_ordinal') == int(os.environ['ENTRY_ORDINAL'])
          assert report.get('credential_entry_attempts', 0) == 0
          assert report.get('form_value_write_attempts', 0) == 0
          assert report.get('file_upload_attempts', 0) == 0
          assert report.get('submit_attempts', 0) == 0
          assert report.get('safe_fill_allowed') is False
          assert report.get('final_submit_allowed') is False
          pre = report['pre_navigation']
          assert pre.get('navigation_surface_fingerprint')
          route = report['next_route']
          assert route.get('automation_resume_allowed') is False
          assert route.get('safe_fill_allowed') is False
          assert route.get('final_submit_allowed') is False
          if report.get('canary_status') != 'clicked':
              raise SystemExit(f"ADP navigation canary blocked: {report.get('error_code')}")
          assert report.get('navigation_click_attempts') == 1
          assert report.get('navigation_click_successes') == 1
          assert pre.get('runtime_state') == 'application_entry_observed'
          assert pre.get('navigation_surface_fingerprint') == os.environ['EXPECTED_SURFACE_FP']
          assert route.get('route') in {'human_handoff', 'manifest_review_candidate', 'diagnostic_review'}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gd004-adp-navigation-canary-${{ github.run_id }}
          path: adp-navigation-canary.json
          if-no-files-found: ignore
          retention-days: 14
