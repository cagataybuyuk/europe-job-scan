name: GD-004 LinkedIn Source Resolution

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable main SHA to resolve from
        required: true
        type: string
      target_url:
        description: Approved HTTPS LinkedIn job-view URL
        required: true
        type: string
      approval_phrase:
        description: Type APPROVE-TEST-LINKEDIN-SOURCE-RESOLUTION
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EJS_FORM_WRITE: 'false'
      EJS_FILE_UPLOAD: 'false'
      EJS_FINAL_SUBMIT: 'false'
      EJS_KILL_SWITCH: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Assert immutable read-only boundary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVAL: ${{ inputs.approval_phrase }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$APPROVAL" = "APPROVE-TEST-LINKEDIN-SOURCE-RESOLUTION"
          test "$EJS_FORM_WRITE" = "false"
          test "$EJS_FILE_UPLOAD" = "false"
          test "$EJS_FINAL_SUBMIT" = "false"
          test "$EJS_KILL_SWITCH" = "true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Resolve approved LinkedIn source without interaction authority
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python -m ejs.services.linkedin_live_resolver \
            --url "$TARGET_URL" \
            --output linkedin-source-resolution.json
      - name: Reassert zero side effects and fail-closed resolution
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          report = json.load(open('linkedin-source-resolution.json', encoding='utf-8'))
          assert report['inspection_only'] is True
          assert report['source'] == 'linkedin'
          assert report['automation_execution_ready'] is False
          assert report.get('form_value_write_attempts', 0) == 0
          assert report.get('file_upload_attempts', 0) == 0
          assert report.get('submit_attempts', 0) == 0
          assert report.get('click_attempts', 0) == 0
          assert report.get('credential_entry_attempts', 0) == 0
          assert report['resolution_state'] in {
              'external_apply_resolved',
              'linkedin_easy_apply',
              'login_boundary',
              'challenge_boundary',
              'external_apply_unresolved',
              'apply_target_not_discovered',
          }
          if report['resolution_state'] == 'external_apply_resolved':
              target = report.get('external_apply_url') or ''
              parsed = urlparse(target)
              host = (parsed.hostname or '').lower()
              assert parsed.scheme == 'https'
              assert host != 'linkedin.com' and not host.endswith('.linkedin.com')
              assert report['source_resolution_ready'] is True
              assert report['ats_inspection_candidate'] is True
          else:
              assert report.get('external_apply_url') is None
              assert report['source_resolution_ready'] is False
              assert report['ats_inspection_candidate'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gd004-linkedin-source-resolution-${{ github.run_id }}
          path: linkedin-source-resolution.json
          retention-days: 14
