name: GD-004 ADP Identity Safe-Fill Canary

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable main SHA to execute
        required: true
        type: string
      target_url:
        description: Approved HTTPS ADP Workforce Now application URL
        required: true
        type: string
      expected_navigation_surface_fingerprint:
        description: Exact approved pre-navigation surface fingerprint
        required: true
        type: string
      entry_ordinal:
        description: Approved visible Apply ordinal
        required: true
        type: number
      expected_safe_fill_surface_fingerprint:
        description: Exact approved post-Apply visible-control surface fingerprint
        required: true
        type: string
      approval_phrase:
        description: Type APPROVE-TEST-ADP-IDENTITY-SAFE-FILL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gd004-adp-safe-fill-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: gd004-safe-fill-upload-canary
    env:
      EJS_FORM_WRITE: 'true'
      EJS_FILE_UPLOAD: 'false'
      EJS_FINAL_SUBMIT: 'false'
      EJS_KILL_SWITCH: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Assert immutable bounded safe-fill boundary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVAL: ${{ inputs.approval_phrase }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$APPROVAL" = "APPROVE-TEST-ADP-IDENTITY-SAFE-FILL"
          test "$EJS_FORM_WRITE" = "true"
          test "$EJS_FILE_UPLOAD" = "false"
          test "$EJS_FINAL_SUBMIT" = "false"
          test "$EJS_KILL_SWITCH" = "true"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium

      - name: Materialize candidate profile without logging values
        env:
          PROFILE_MANIFEST: ${{ secrets.EJS_LIVE_CANARY_MANIFEST_JSON }}
        shell: bash
        run: |
          test -n "$PROFILE_MANIFEST"
          printf '%s\n' "$PROFILE_MANIFEST" > candidate-profile.json
          python - <<'PY'
          import json
          data = json.load(open('candidate-profile.json', encoding='utf-8'))
          assert isinstance(data.get('field_plan'), list)
          canonical = {str(x.get('canonical_field', '')) for x in data['field_plan'] if isinstance(x, dict)}
          assert {'candidate.first_name', 'candidate.last_name', 'candidate.email'} <= canonical
          PY

      - name: Execute one Apply click plus three reviewed identity writes
        env:
          TARGET_URL: ${{ inputs.target_url }}
          EXPECTED_NAV_FP: ${{ inputs.expected_navigation_surface_fingerprint }}
          ENTRY_ORDINAL: ${{ inputs.entry_ordinal }}
          EXPECTED_FILL_FP: ${{ inputs.expected_safe_fill_surface_fingerprint }}
        shell: bash
        run: |
          set +e
          python -m ejs.services.adp_safe_fill_canary \
            --url "$TARGET_URL" \
            --expected-navigation-surface-fingerprint "$EXPECTED_NAV_FP" \
            --entry-ordinal "$ENTRY_ORDINAL" \
            --expected-safe-fill-surface-fingerprint "$EXPECTED_FILL_FP" \
            --profile-manifest candidate-profile.json \
            --output adp-safe-fill-canary.json
          status=$?
          echo "CANARY_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Reassert bounded mutation and exact readback
        env:
          EXPECTED_NAV_FP: ${{ inputs.expected_navigation_surface_fingerprint }}
          EXPECTED_FILL_FP: ${{ inputs.expected_safe_fill_surface_fingerprint }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('adp-safe-fill-canary.json', encoding='utf-8'))
          assert report.get('safe_fill_canary_only') is True
          assert report.get('expected_navigation_surface_fingerprint') == os.environ['EXPECTED_NAV_FP']
          assert report.get('expected_safe_fill_surface_fingerprint') == os.environ['EXPECTED_FILL_FP']
          assert report.get('navigation_click_attempts') <= 1
          assert report.get('navigation_click_successes') <= 1
          assert report.get('credential_entry_attempts', 0) == 0
          assert report.get('file_upload_attempts', 0) == 0
          assert report.get('second_action_click_attempts', 0) == 0
          assert report.get('submit_attempts', 0) == 0
          assert report.get('further_navigation_allowed') is False
          assert report.get('file_upload_allowed') is False
          assert report.get('final_submit_allowed') is False
          if report.get('canary_status') == 'filled_verified':
              assert report.get('navigation_click_attempts') == 1
              assert report.get('navigation_click_successes') == 1
              assert 0 <= report.get('form_value_write_attempts', 0) <= 3
              fields = report.get('field_results', [])
              assert len(fields) == 3
              assert all(x.get('readback_match') is True for x in fields)
              assert all(x.get('valid') is True for x in fields)
          PY

      - name: Upload non-secret safe-fill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gd004-adp-safe-fill-canary-${{ github.run_id }}
          path: adp-safe-fill-canary.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed when canary did not verify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('adp-safe-fill-canary.json', encoding='utf-8'))
          assert os.environ.get('CANARY_EXIT_CODE') == '0'
          assert report.get('canary_status') == 'filled_verified'
          assert report.get('file_upload_attempts', 0) == 0
          assert report.get('submit_attempts', 0) == 0
          PY
