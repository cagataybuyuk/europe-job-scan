name: GD-004 Shadow Adapter Read-Only Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'tests/unit/test_smartrecruiters_shadow.py'
      - '.github/workflows/gd004-shadow-adapter-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'tests/unit/test_smartrecruiters_shadow.py'
      - '.github/workflows/gd004-shadow-adapter-regression.yml'

permissions:
  contents: read

jobs:
  shadow-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run pure and real Chromium shadow inspection regressions
        run: python -m unittest discover -s tests/unit -p test_smartrecruiters_shadow.py -v
