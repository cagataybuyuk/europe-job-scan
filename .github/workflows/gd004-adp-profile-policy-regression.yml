name: GD-004 ADP Profile Policy Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/adp_profile_policy.py'
      - 'src/ejs/services/adp_validation_contract.py'
      - 'tests/unit/test_adp_profile_policy.py'
      - 'docs/GD004_ADP_PROFILE_POLICY.md'
      - '.github/workflows/gd004-adp-profile-policy-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run ADP profile policy tests
        run: python -m unittest discover -s tests/unit -p 'test_adp_profile_policy.py' -v
      - name: Assert profile resolver has no browser or network authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/ejs/services/adp_profile_policy.py').read_text(encoding='utf-8')
          forbidden = (
              'sync_playwright', 'async_playwright', '.click(', '.fill(', '.select_option(',
              '.press(', '.check(', '.uncheck(', 'set_input_files(', 'requests.', 'httpx.',
              'subprocess.', 'os.system(', 'final_submit', 'file_upload_allowed',
          )
          found = [token for token in forbidden if token in text]
          assert not found, found
          assert 'adp_ascii_name_policy_approved' in text
          assert 'phone_country_iso2' in text
          assert 'phone_national_number' in text
          assert 'raw_values_exposed' in text
          PY
