name: GD-004 Offline Shadow Writer Regression

on:
  pull_request:
    paths:
      - 'src/ejs/services/shadow_fixture_writer.py'
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'src/ejs/contracts/prefill.py'
      - 'src/ejs/services/prefill_writer.py'
      - 'tests/unit/test_shadow_fixture_writer.py'
      - '.github/workflows/gd004-shadow-writer-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/ejs/services/shadow_fixture_writer.py'
      - 'src/ejs/services/smartrecruiters_shadow.py'
      - 'src/ejs/contracts/prefill.py'
      - 'src/ejs/services/prefill_writer.py'
      - 'tests/unit/test_shadow_fixture_writer.py'
      - '.github/workflows/gd004-shadow-writer-regression.yml'

permissions:
  contents: read

jobs:
  offline-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Verify offline fixture writes without uploads or transitions
        run: python -m unittest discover -s tests/unit -p test_shadow_fixture_writer.py -v
